query ObtenerHorarioActivoUsuario($usuarioId: UUID!, $diaSemana: Int!) @auth(level: NO_ACCESS) {
  horarios(
    where: {
      usuario: { id: { eq: $usuarioId } }
      activo: { eq: true }
      diasSemana: { includes: $diaSemana }
    }
    limit: 1
  ) {
    id
    usuario {
      id
      nombre
      apellido
      rut
      correo
      authUid
      rol
      activo
    }
    diasSemana
    horaEntrada
    horaSalida
    activo
  }
}

