query ObtenerAsistenciaPorUsuarioYFecha($usuarioId: UUID!, $fecha: Date!) @auth(level: NO_ACCESS) {
  asistencia(key: { usuarioId: $usuarioId, fecha: $fecha }) {
    usuario {
      id
      nombre
      apellido
      rut
      correo
      authUid
      rol
      activo
    }
    fecha
    horaEntrada
    estadoEntrada
    minutosAtraso
    horaSalida
    estadoSalida
    minutosSalidaAnticipada
    observacion
  }
}

query ListarAsistenciasUsuarioPorRango($usuarioId: UUID!, $fechaInicio: Date!, $fechaFin: Date!) @auth(level: NO_ACCESS) {
  asistencias(
    where: {
      usuario: { id: { eq: $usuarioId } }
      fecha: { ge: $fechaInicio, le: $fechaFin }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    usuario {
      id
      nombre
      apellido
      rut
      correo
      authUid
      rol
      activo
    }
    fecha
    horaEntrada
    estadoEntrada
    minutosAtraso
    horaSalida
    estadoSalida
    minutosSalidaAnticipada
    observacion
  }
}

query ListarAtrasos($fechaInicio: Date, $fechaFin: Date, $usuarioId: UUID) @auth(level: NO_ACCESS) {
  asistencias(
    where: {
      estadoEntrada: { eq: "ATRASO" }
      fecha: { ge: $fechaInicio, le: $fechaFin }
      usuario: { id: { eq: $usuarioId } }
    }
    orderBy: [{ fecha: DESC }]
  ) {
    usuario {
      id
      nombre
      apellido
      rut
      correo
      authUid
      rol
      activo
    }
    fecha
    horaEntrada
    estadoEntrada
    minutosAtraso
  }
}

