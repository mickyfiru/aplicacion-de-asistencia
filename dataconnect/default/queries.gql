query ObtenerMisAsistencias($desde: Timestamp!, $hasta: Timestamp!) @auth(level: USER) {
  asistencias(
    where: {
      usuario: { authUid: { eq_expr: "auth.uid" } }
      horaEntrada: { ge: $desde, lt: $hasta }
    }
    orderBy: [{ horaEntrada: DESC }]
  ) {
    id
    usuario {
      id
      authUid
      rol
      activo
    }
    fecha
    horaEntrada
    estadoEntrada
    minutosAtraso
    horaSalida
    estadoSalida
    minutosSalidaAnticipada
