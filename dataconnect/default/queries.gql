query BuscarUsuarioPorId($id: UUID!) @auth(level: NO_ACCESS) {
  user(id: $id) {
    id
    nombre
    apellido
    rut
    correo
    authUid
    rol
    activo
    fechaCreacion
  }
}

query BuscarUsuarioPorCorreo($correo: String!) @auth(level: NO_ACCESS) {
  users(where: { correo: { eq: $correo } }, limit: 1) {
    id
    nombre
    apellido
    rut
    correo
    authUid
    rol
    activo
    fechaCreacion
  }
}

query BuscarUsuarioPorRut($rut: String!) @auth(level: NO_ACCESS) {
  users(where: { rut: { eq: $rut } }, limit: 1) {
    id
    nombre
    apellido
    rut
    correo
    authUid
    rol
    activo
    fechaCreacion
  }
}

query ListarUsuariosActivos @auth(level: NO_ACCESS) {
  users(where: { activo: { eq: true } }, orderBy: [{ nombre: ASC }]) {
    id
    nombre
    apellido
    rut
    correo
    authUid
    rol
    activo
    fechaCreacion
  }
}

query BuscarUsuarioPorAuthUid($authUid: String!) @auth(level: NO_ACCESS) {
